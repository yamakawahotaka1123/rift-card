<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参加応募フォーム｜SUMMONER CARD</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=M+PLUS+1p:wght@400;500;700;800&display=swap">
  <style>
    :root {
      --bg: #06090d;
      --panel: #0b1016;
      --panel2: #111822;
      --line: #22303e;
      --gold: #c8aa6e;
      --gold2: #f0e6d2;
      --text: #e8e2d4;
      --muted: #7c8794;
      --danger: #e05a5a;
      --ok: #5ec98f;
    }
    * { box-sizing: border-box; }
    ::selection { background: var(--gold); color: #140a00; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(900px 500px at 50% -10%, #122235 0%, transparent 60%), var(--bg);
      font-family: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 36px 16px 60px; }
    .brand { display: flex; align-items: center; gap: 8px; font-family: "Cinzel", serif; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--gold2); font-size: 15px; margin-bottom: 22px; }
    .brand small { font-family: "M PLUS 1p", sans-serif; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 11px; font-weight: 500; }

    h1 { font-size: 21px; margin: 0 0 8px; color: var(--gold2); }
    p.lead { color: var(--muted); font-size: 13.5px; line-height: 1.8; margin: 0 0 24px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }

    .field { margin-bottom: 18px; }
    .field:last-of-type { margin-bottom: 0; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--gold2); margin-bottom: 6px; }
    label .req { color: var(--danger); margin-left: 2px; }
    label .opt { color: var(--muted); font-weight: 500; font-size: 11px; margin-left: 4px; }
    input[type="text"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel2); color: var(--text); font-size: 14px; font-family: inherit;
    }
    input[type="text"]::placeholder, textarea::placeholder { color: #566270; }
    textarea { resize: vertical; min-height: 72px; line-height: 1.6; }

    .follow-box {
      display: flex; align-items: flex-start; gap: 10px; background: var(--panel2);
      border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px;
    }
    .follow-box input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--gold); flex-shrink: 0; }
    .follow-box label { font-size: 13px; font-weight: 500; color: var(--text); margin: 0; line-height: 1.6; }
    .follow-box a { color: var(--gold); text-decoration: none; border-bottom: 1px dotted var(--gold); }
    .follow-box a:hover { color: var(--gold2); }

    button#submit-btn {
      width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer;
      background: var(--gold); color: #1a1406; font-size: 15px; font-weight: 700; font-family: inherit;
      transition: filter .15s ease;
    }
    button#submit-btn:hover { filter: brightness(1.08); }
    button#submit-btn:disabled { opacity: .5; cursor: default; }

    #msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
    #msg.ok { color: var(--ok); }
    #msg.err { color: var(--danger); }

    .done { text-align: center; padding: 20px 10px; }
    .done .icon { font-size: 40px; margin-bottom: 10px; }
    .done h2 { color: var(--gold2); font-size: 18px; margin: 0 0 10px; }
    .done p { color: var(--muted); font-size: 13.5px; line-height: 1.8; margin: 0; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">SUMMONER CARD <small>参加応募フォーム</small></div>

    <div id="form-view">
      <h1>サーバー参加応募</h1>
      <p class="lead">
        参加を希望する方は、下のフォームに記入して送信してください。内容を確認し、OKであればこちらからX（旧Twitter）のDMでご連絡します。
      </p>

      <form class="card" id="apply-form">
        <div class="field">
          <label for="x_account">Xアカウント<span class="req">*</span></label>
          <input type="text" id="x_account" placeholder="@example" required maxlength="100" autocomplete="off">
        </div>

        <div class="field">
          <label for="riot_id">メインアカウントのRiot ID<span class="req">*</span></label>
          <input type="text" id="riot_id" placeholder="例: ゲーム名#タグ" required maxlength="100" autocomplete="off">
        </div>

        <div class="field">
          <label for="highest_rank">過去最高レート<span class="req">*</span></label>
          <input type="text" id="highest_rank" placeholder="例: エメラルド2（24シーズン）" required maxlength="50" autocomplete="off">
        </div>

        <div class="field">
          <label for="other">その他質問・コメント<span class="opt">任意</span></label>
          <textarea id="other" placeholder="聞きたいこと・伝えたいことがあれば" maxlength="1000"></textarea>
        </div>

        <div class="follow-box">
          <input type="checkbox" id="follow_confirmed" required>
          <label for="follow_confirmed">
            <a href="https://x.com/hotaka_1123" target="_blank" rel="noopener">@hotaka_1123</a> をフォローしました
          </label>
        </div>

        <button type="submit" id="submit-btn">応募する</button>
        <div id="msg"></div>
      </form>
    </div>

    <div class="card done" id="done-view" hidden>
      <div class="icon">✅</div>
      <h2>応募ありがとうございます</h2>
      <p>内容を確認し、OKであればXのDMでご連絡します。しばらくお待ちください。</p>
    </div>
  </div>

  <script>
    const API = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://summonercard-api.summonercard.workers.dev';

    const form = document.getElementById('apply-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = '';
      btn.disabled = true;
      btn.textContent = '送信中…';

      const payload = {
        xAccount: document.getElementById('x_account').value.trim(),
        riotId: document.getElementById('riot_id').value.trim(),
        highestRank: document.getElementById('highest_rank').value.trim(),
        otherQuestion: document.getElementById('other').value.trim(),
        followConfirmed: document.getElementById('follow_confirmed').checked,
      };

      try {
        const res = await fetch(`${API}/apply`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error('failed');
        document.getElementById('form-view').hidden = true;
        document.getElementById('done-view').hidden = false;
      } catch (err) {
        msg.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
        msg.className = 'err';
        btn.disabled = false;
        btn.textContent = '応募する';
      }
    });
  </script>
</body>
</html>
