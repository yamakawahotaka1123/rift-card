name = "summonercard-api"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
# Ranked matches read per lookup. Keep it low on a development key (100 requests / 2 minutes).
MATCH_COUNT = "20"

# The Riot API key is a secret: npx wrangler secret put RIOT_KEY

# フィアレスドラフト（/draft/*）: 1セッション = 1 Durable Object
[[durable_objects.bindings]]
name = "DRAFT_SESSION"
class_name = "DraftSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DraftSession"]
