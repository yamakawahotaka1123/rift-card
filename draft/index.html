<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>フィアレスドラフト｜SUMMONER CARD</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=M+PLUS+1p:wght@400;500;700;800&display=swap">
  <style>
    :root {
      --bg: #06090d;
      --panel: #0b1016;
      --panel2: #111822;
      --line: #22303e;
      --gold: #c8aa6e;
      --gold2: #f0e6d2;
      --blue: #3fa9f5;
      --blue-dim: #1b3a52;
      --red: #ef3e45;
      --red-dim: #4a1f22;
      --text: #e8e2d4;
      --muted: #7c8794;
      --gold-rgb: 200, 170, 110;
    }
    * { box-sizing: border-box; }
    ::selection { background: var(--gold); color: #140a00; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(900px 500px at 50% -10%, #122235 0%, transparent 60%), var(--bg);
      font-family: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; transition: transform .15s ease, box-shadow .15s ease, filter .15s ease, border-color .15s ease, background-color .15s ease; }
    button:disabled { transition: none; }
    .wrap { max-width: 1600px; margin: 0 auto; padding: 14px 10px 40px; }

    /* ---- header ---- */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 8px; font-family: "Cinzel", serif; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--gold2); font-size: 17px; }
    #side-badge { font-weight: 800; padding: 4px 12px; border-radius: 999px; font-size: 13px; }
    #side-badge.blue { background: rgba(63,169,245,.15); color: var(--blue); border: 1px solid var(--blue); }
    #side-badge.red { background: rgba(239,62,69,.15); color: var(--red); border: 1px solid var(--red); }
    #side-badge.spectator { background: rgba(255,255,255,.08); color: var(--muted); border: 1px solid var(--line); }
    #status { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 4px; }

    /* ---- draft order progress bar ---- */
    #progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    #progress-bar { flex: 1; display: flex; gap: 3px; }
    .progress-seg { flex: 1; height: 8px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--line); transition: background-color .2s ease, border-color .2s ease; }
    .progress-seg.done.blue { background: var(--blue); border-color: var(--blue); }
    .progress-seg.done.red { background: var(--red); border-color: var(--red); }
    .progress-seg.done.ban { opacity: .5; }
    .progress-seg.current { border-color: var(--gold); box-shadow: 0 0 8px rgba(var(--gold-rgb), .6); }
    #progress-count { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ---- center info ---- */
    .center-bar { text-align: center; margin-bottom: 10px; }
    #game-badge { font-family: "Cinzel", serif; color: var(--gold); font-size: 15px; letter-spacing: .08em; }
    #turn {
      margin-top: 6px; display: inline-block; padding: 8px 22px; border-radius: 999px;
      background: var(--panel2); border: 1px solid var(--line); font-size: 14px; transition: border-color .2s ease, color .2s ease;
    }
    #turn.your-turn { border-color: var(--gold); color: var(--gold2); animation: turn-pulse 2.2s ease-in-out infinite; }
    @keyframes turn-pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(var(--gold-rgb), .25); }
      50% { box-shadow: 0 0 20px rgba(var(--gold-rgb), .55); }
    }
    @media (prefers-reduced-motion: reduce) {
      #turn.your-turn { animation: none; box-shadow: 0 0 16px rgba(var(--gold-rgb), .35); }
    }
    #timer { font-variant-numeric: tabular-nums; margin-left: 10px; font-weight: 800; transition: color .2s ease; }
    #timer.low { color: var(--red); }

    /* ---- ready check ---- */
    #ready-panel { margin-top: 10px; }
    .ready-status { display: flex; justify-content: center; gap: 18px; margin-bottom: 10px; font-size: 14px; }
    .ready-status .side.ok { color: var(--gold2); }
    .ready-status .side.wait { color: var(--muted); }
    #ready-btn {
      display: block; margin: 0 auto; padding: 10px 28px; border-radius: 999px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--gold), #a8854a); color: #140a00; font-weight: 800; font-size: 14px;
      box-shadow: 0 4px 14px rgba(var(--gold-rgb), .25);
    }
    #ready-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(var(--gold-rgb), .4); }
    #ready-btn.pressed { background: var(--panel2); color: var(--muted); box-shadow: none; }
    #ready-btn:disabled { opacity: .5; cursor: default; }
    #ready-btn[hidden] { display: none; }

    /* ---- redo request ---- */
    #redo-row { margin-top: 8px; text-align: center; }
    #redo-btn {
      padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2);
      color: var(--text); cursor: pointer; font-size: 12px;
    }
    #redo-btn:hover { border-color: var(--gold); }
    #redo-btn.requested { border-color: var(--gold); color: var(--gold2); background: rgba(var(--gold-rgb), .1); }
    #redo-note { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ---- ban row ---- */
    .ban-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
    .bans { display: flex; gap: 6px; }
    .ban-slot {
      width: 42px; height: 42px; border-radius: 6px; overflow: hidden; position: relative;
      background: var(--panel2); border: 1px solid var(--line);
    }
    .ban-slot img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(.55); }
    .ban-slot.empty { opacity: .4; display: flex; align-items: center; justify-content: center; }
    .ban-slot .ban-num { font-size: 12px; color: var(--muted); font-weight: 700; }
    .ban-slot.filled::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(45deg, transparent 46%, currentColor 48%, currentColor 52%, transparent 54%);
    }
    .bans.blue .ban-slot.filled { color: var(--blue); }
    .bans.red .ban-slot.filled { color: var(--red); }
    .vs-divider { font-family: "Cinzel", serif; color: var(--muted); font-size: 13px; }

    /* ---- stage ---- */
    .stage { display: grid; grid-template-columns: 280px minmax(320px, 1fr) 280px; gap: 16px; align-items: start; justify-content: center; }
    .picks-col { max-width: 260px; }
    .picks-col.blue { margin-left: auto; }
    .picks-col.red { margin-right: auto; }
    .team-header {
      font-family: "Cinzel", serif; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    }
    .team-header.blue { color: var(--blue); }
    .team-header.red { color: var(--red); text-align: right; }
    .picks { display: flex; flex-direction: column; gap: 6px; }
    .pick-row {
      display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px;
      background: var(--panel2); border: 1px solid var(--line); transition: box-shadow .2s ease, border-color .2s ease;
    }
    .picks-col.blue .pick-row { border-left: 3px solid var(--blue); }
    .picks-col.red .pick-row { border-right: 3px solid var(--red); }
    .pick-row-icon { flex: none; width: 44px; height: 44px; border-radius: 7px; object-fit: cover; background: var(--bg); border: 1px solid var(--line); }
    .pick-row-icon.empty-icon { opacity: .35; }
    .pick-row-text { min-width: 0; }
    .pick-num { font-size: 10px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
    .pick-row-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick-row.empty .pick-row-name { color: var(--muted); font-weight: 400; }
    .pick-row.active { box-shadow: 0 0 0 2px var(--gold), 0 0 14px rgba(var(--gold-rgb), .4); border-color: var(--gold); }
    .pick-row.preview .pick-row-icon { opacity: .6; }
    .pick-row.preview { outline: 2px dashed var(--gold); outline-offset: -2px; }

    /* ---- center champ select ---- */
    .champ-select { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    #champ-search {
      width: 100%; padding: 8px 10px; margin-bottom: 8px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 13px; transition: border-color .15s ease;
    }
    #champ-search:focus { border-color: var(--gold); outline: none; }
    #key-hint { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-align: right; }

    /* ---- toast ---- */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 12px 22px;
      font-size: 14px; color: var(--gold2); box-shadow: 0 8px 28px rgba(0,0,0,.5); z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #champ-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; max-height: 64vh; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    #champ-grid::-webkit-scrollbar { width: 8px; }
    #champ-grid::-webkit-scrollbar-track { background: transparent; }
    #champ-grid::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    #champ-grid::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    .champ {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border-radius: 7px;
      border: 1px solid transparent; background: var(--panel2); color: var(--text); cursor: pointer; font-size: 11px;
      transition: border-color .12s ease, background-color .12s ease, transform .1s ease, box-shadow .12s ease;
    }
    .champ-badge {
      position: absolute; top: 2px; left: 2px; font-size: 8px; font-weight: 800; letter-spacing: .02em;
      padding: 1px 4px; border-radius: 4px; color: #140a00; line-height: 1.4;
    }
    .champ-badge.ban { background: var(--red); color: #fff; }
    .champ-badge.blue { background: var(--blue); }
    .champ-badge.red { background: var(--red); color: #fff; }
    .champ img { width: 52px; height: 52px; border-radius: 6px; }
    .champ span { line-height: 1.1; text-align: center; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .champ.can-act { border-color: var(--gold); }
    .champ.can-act:hover { background: #1c2430; transform: translateY(-2px); }
    .champ.disabled { opacity: .25; cursor: not-allowed; }
    .champ.hovering { border-color: var(--gold); background: #2a2210; box-shadow: 0 0 0 2px rgba(var(--gold-rgb), .5); }
    .champ.fearless { position: relative; }
    .champ.fearless:not(.disabled) { border-color: var(--red); }
    .champ.fearless::after {
      content: '🔒'; position: absolute; top: 2px; right: 2px; font-size: 10px; line-height: 1;
      background: rgba(6,9,13,.85); border: 1px solid var(--red); border-radius: 50%;
      width: 17px; height: 17px; display: flex; align-items: center; justify-content: center;
    }

    #confirm-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px;
    }
    #confirm-bar[hidden] { display: none; }
    #confirm-label { font-size: 13px; color: var(--muted); }
    #confirm-btn {
      padding: 7px 18px; border-radius: 999px; border: none; cursor: pointer; font-size: 13px; font-weight: 800;
      background: linear-gradient(135deg, var(--gold), #a8854a); color: #140a00;
    }
    #confirm-btn:not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.08); }
    #confirm-btn:disabled { opacity: .4; cursor: default; background: var(--panel2); color: var(--muted); }

    .ban-slot.preview img, .pick-card.preview { opacity: .55; }
    .ban-slot.preview { outline: 2px dashed var(--gold); outline-offset: -1px; }
    .pick-card.preview { outline: 2px dashed var(--gold); outline-offset: -2px; }

    #next-game {
      display: block; margin: 16px auto 0; padding: 12px 30px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, var(--gold), #a8854a); color: #140a00; font-weight: 800; cursor: pointer;
      font-size: 14px; letter-spacing: .03em; box-shadow: 0 4px 14px rgba(var(--gold-rgb), .25);
    }
    #next-game:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(var(--gold-rgb), .4); }
    #next-game[hidden] { display: none; }

    /* ---- broadcast (spectator / OBS overlay) view ---- */
    .broadcast { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; z-index: 50; }
    .broadcast[hidden] { display: none; }
    .broadcast .cam-area { flex: 1; background: #00ff00; }
    .bcast-bar {
      flex: none; position: relative; background: linear-gradient(180deg, #0b1016 0%, #06090d 100%);
      border-top: 2px solid var(--gold); padding: 14px 26px 18px; box-shadow: 0 -16px 32px -16px rgba(var(--gold-rgb), .18);
    }
    .bcast-center { text-align: center; margin-bottom: 12px; }
    #bcast-game-badge { font-family: "Cinzel", serif; color: var(--gold); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
    #bcast-turn-text { font-size: 16px; margin-top: 4px; font-weight: 700; color: var(--gold2); }
    #bcast-timer { font-variant-numeric: tabular-nums; font-weight: 800; margin-left: 8px; }
    #bcast-timer.low { color: var(--red); }
    .bcast-row { display: flex; align-items: flex-end; gap: 14px; }
    .bcast-side { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .bcast-side.red { align-items: flex-end; }
    .bcast-bans { display: flex; gap: 4px; }
    .bcast-side.red .bcast-bans { flex-direction: row-reverse; }
    .bcast-ban { width: 34px; height: 34px; border-radius: 5px; overflow: hidden; position: relative; background: var(--panel2); border: 1px solid var(--line); }
    .bcast-ban img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(.5); }
    .bcast-ban.empty { opacity: .35; }
    .bcast-ban.filled::after { content: ''; position: absolute; inset: 0; background: linear-gradient(45deg, transparent 44%, var(--red) 48%, var(--red) 52%, transparent 56%); }
    .bcast-picks { display: flex; gap: 6px; }
    .bcast-side.red .bcast-picks { flex-direction: row-reverse; }
    .bcast-pick {
      width: 72px; height: 100px; border-radius: 6px; overflow: hidden; position: relative;
      background-color: var(--panel2); border-bottom: 3px solid var(--line);
    }
    .bcast-side.blue .bcast-pick { border-bottom-color: var(--blue); }
    .bcast-side.red .bcast-pick { border-bottom-color: var(--red); }
    .bcast-pick-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
    .bcast-pick-img.fallback { object-fit: contain; object-position: center; padding: 10px; background: var(--bg); }
    .bcast-pick .fade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,8,12,.95) 0%, rgba(5,8,12,.05) 65%); }
    .bcast-pick .name { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 4px 2px; font-size: 10px; font-weight: 700; text-align: center; text-shadow: 0 1px 3px #000; line-height: 1.15; }
    .bcast-ban.preview img, .bcast-pick.preview { opacity: .55; }
    .bcast-ban.preview { outline: 2px dashed var(--gold); outline-offset: -1px; }
    .bcast-pick.preview { outline: 2px dashed var(--gold); outline-offset: -2px; }
    .bcast-vs { font-family: "Cinzel", serif; color: var(--gold); font-size: 20px; font-weight: 700; padding: 0 6px 30px; text-shadow: 0 0 16px rgba(var(--gold-rgb), .4); }
    .bcast-ban, .bcast-pick { transition: outline-color .15s ease; }

    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; }
      .picks-col { max-width: none; margin-left: 0; margin-right: 0; }
      .team-header.red { text-align: left; }
    }

    /* ---- lobby (room creation) ---- */
    .lobby {
      max-width: 480px; margin: 40px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,.6);
    }
    .lobby h1 { font-family: "Cinzel", serif; font-size: 22px; letter-spacing: .02em; color: var(--gold2); margin: 0 0 6px; }
    .lobby p.lead { color: var(--muted); font-size: 13px; margin: 0 0 22px; line-height: 1.6; }
    .lobby label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .lobby .field { margin-bottom: 18px; }
    .lobby select, .lobby input[type="number"] {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel2); color: var(--text); font-size: 14px; transition: border-color .15s ease;
    }
    .lobby select:focus, .lobby input[type="number"]:focus { border-color: var(--gold); outline: none; }
    .lobby .segmented { display: flex; gap: 8px; }
    .lobby .segmented button {
      flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2);
      color: var(--text); cursor: pointer; font-size: 14px;
    }
    .lobby .segmented button.active { border-color: var(--gold); color: var(--gold2); background: #1c2430; }
    #lobby-create {
      width: 100%; padding: 12px; border-radius: 999px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--gold), #a8854a); color: #140a00; font-weight: 800; font-size: 14px;
      box-shadow: 0 4px 14px rgba(var(--gold-rgb), .25);
    }
    #lobby-create:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(var(--gold-rgb), .4); }
    #lobby-create:disabled { opacity: .5; cursor: default; box-shadow: none; }
    .lobby-links { margin-top: 22px; display: none; }
    .lobby-links.show { display: block; }
    .link-row { margin-bottom: 14px; }
    .link-row .label { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .link-row.blue .label { color: var(--blue); }
    .link-row.red .label { color: var(--red); }
    .link-row.spectator .label { color: var(--muted); }
    .link-copy { display: flex; gap: 6px; }
    .link-copy input {
      flex: 1; min-width: 0; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--panel2); color: var(--text); font-size: 12px;
    }
    .link-copy button {
      padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2);
      color: var(--text); cursor: pointer; font-size: 12px; flex: none;
    }
    .link-copy button:hover { border-color: var(--gold); }
    .lobby-note { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">⚔ FEARLESS DRAFT</div>
      <div id="side-badge"></div>
    </header>
    <div id="status"></div>

    <div id="lobby" class="lobby" hidden>
      <h1>部屋を作る</h1>
      <p class="lead">シリーズの形式と1手あたりの制限時間を決めて「作成」を押すと、青チーム・赤チーム・観戦用のリンクが発行されます。</p>
      <div class="field">
        <label>シリーズ形式</label>
        <div class="segmented" id="lobby-bo">
          <button type="button" data-value="3" class="active">BO3</button>
          <button type="button" data-value="5">BO5</button>
        </div>
      </div>
      <div class="field">
        <label>1手あたりの制限時間（秒）</label>
        <input type="number" id="lobby-timer" value="60" min="5" max="120">
      </div>
      <button type="button" id="lobby-create">作成</button>
      <div class="lobby-links" id="lobby-links">
        <div class="link-row blue"><div class="label">🔵 BLUEチーム用リンク</div>
          <div class="link-copy"><input type="text" id="link-blue" readonly><button type="button" data-copy="link-blue">コピー</button></div></div>
        <div class="link-row red"><div class="label">🔴 REDチーム用リンク</div>
          <div class="link-copy"><input type="text" id="link-red" readonly><button type="button" data-copy="link-red">コピー</button></div></div>
        <div class="link-row spectator"><div class="label">👀 観戦用リンク</div>
          <div class="link-copy"><input type="text" id="link-spectator" readonly><button type="button" data-copy="link-spectator">コピー</button></div></div>
        <p class="lobby-note">各リンクはそのチーム・観戦者にだけ渡してください。リンクを知っている人は誰でもそのチームとして操作できます。</p>
      </div>
    </div>

    <div id="board" hidden>
      <div id="progress-wrap">
        <div id="progress-bar"></div>
        <span id="progress-count"></span>
      </div>

      <div class="center-bar">
        <div id="game-badge"></div>
        <div id="ready-panel" hidden>
          <div class="ready-status">
            <span class="side" id="ready-blue">🔵 BLUE</span>
            <span class="side" id="ready-red">🔴 RED</span>
          </div>
          <button type="button" id="ready-btn">準備完了</button>
        </div>
        <div id="turn"><span id="turn-text"></span><span id="timer"></span></div>
        <div id="redo-row" hidden>
          <button type="button" id="redo-btn">🔄 この試合をやり直したい</button>
          <div id="redo-note"></div>
        </div>
      </div>

      <div class="ban-row">
        <div id="blue-bans" class="bans blue"></div>
        <div class="vs-divider">VS</div>
        <div id="red-bans" class="bans red"></div>
      </div>

      <div class="stage">
        <div class="picks-col blue">
          <div class="team-header blue">BLUE TEAM</div>
          <div id="blue-picks" class="picks"></div>
        </div>
        <div class="champ-select">
          <input id="champ-search" type="text" placeholder="🔍 チャンピオン検索">
          <div id="confirm-bar" hidden>
            <span id="confirm-label"></span>
            <button type="button" id="confirm-btn" disabled>確定</button>
          </div>
          <p id="key-hint">Enter で確定・Esc で解除</p>
          <div id="champ-grid"></div>
        </div>
        <div class="picks-col red">
          <div class="team-header red">RED TEAM</div>
          <div id="red-picks" class="picks"></div>
        </div>
      </div>

      <button type="button" id="next-game" hidden>次の試合のドラフトへ →</button>
    </div>

    <div id="broadcast" class="broadcast" hidden>
      <div class="cam-area"></div>
      <div class="bcast-bar">
        <div class="bcast-center">
          <div id="bcast-game-badge"></div>
          <div id="bcast-turn-text"><span id="bcast-turn-label"></span><span id="bcast-timer"></span></div>
        </div>
        <div class="bcast-row">
          <div class="bcast-side blue">
            <div class="bcast-bans" id="bcast-bans-blue"></div>
            <div class="bcast-picks" id="bcast-picks-blue"></div>
          </div>
          <div class="bcast-vs">VS</div>
          <div class="bcast-side red">
            <div class="bcast-bans" id="bcast-bans-red"></div>
            <div class="bcast-picks" id="bcast-picks-red"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="/js/draft.js"></script>
</body>
</html>
